<script>// Direct Supabase via fetch (no client library needed)
const _sbUrl = 'https://fgentfiggwhrraewopjq.supabase.co';
const _sbKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnZW50ZmlnZ3docnJhZXdvcGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMTg0NjQsImV4cCI6MjA5Nzg5NDQ2NH0.wdr1YAwwt1Tp5Nu7OhJF7eM8B_1BNMA8BOw9Qtrf1Ac';

async function _sb(path, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['apikey'] = _sbKey;
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  const r = await fetch(_sbUrl + path, opts);
  if (!r.ok) { const e = await r.text().catch(()=>''); throw new Error(r.status+': '+e); }
  const t = await r.text();
  return t ? JSON.parse(t) : [];
}

// ═══ SHOPPING ═══
const shopItems = {
  dry: ["טונה","טחינה","רכז עגבניות","פריכיות","פסטה","אורז","קוסקוס","פתיתים","פרירורי לחם","חומוס גרירים","שעועית לבנה/אדומה","סרדינים בשמן זית","פיתות","לחם"],
  frozen: ["סלמון","חזה עוף (שניצל)","כדורי פירה","צ'יפס","ברוקולי","כרובית","פירות יער","אננס","מנגו","ערמונים"],
  produce: ["תפוחי אדמה","בטטה","תפוז","קישוא","גזר","גמבה"],
  snacks: ["דוריטוס ירוק","במבה"],
  misc: ["תה ירוק ועוד תה אחר","נס קפה"],
  meat: ["בשר טחון"],
  dairy: ["ביצים","חלב","גבינה צהובה","מילקי מגולגלות","יוגורט","גיל תות","קוטג'","נייר טואלט"],
  zero: ["סקווץ' לכלים","מגבונים","נייר סופג","קפסולות למדיח","קפסולות לכביסה","סבון גוף","שמן זית","לאבנה","שקיות זבל","כפפות לטקס","מבשם כביסה"]
};
let shoppingData = {};

async function loadShop() {
  try {
    const data = await _sb('/rest/v1/shopping?select=*');
    data.forEach(r => {
      if (!shoppingData[r.category]) shoppingData[r.category] = {};
      shoppingData[r.category][r.item] = r.checked;
    });
  } catch(e) { console.log('shop load err', e); }
  renderShop();
}

function renderShop() {
  Object.keys(shopItems).forEach(cat => {
    const el = document.getElementById(cat);
    if (!el) return;
    const saved = shoppingData[cat] || {};
    el.innerHTML = shopItems[cat].map(item => {
      const checked = saved[item] || false;
      return '<div class="item '+(checked?'checked':'')+'"><input type="checkbox" id="scb_'+cat+'_'+item+'" '+(checked?'checked':'')+' onchange="toggleShop(\''+cat+'\',\''+item+'\')"><label for="scb_'+cat+'_'+item+'">'+item+'</label></div>';
    }).join('');
  });
}

async function toggleShop(cat, item) {
  const checked = !(shoppingData[cat]?.[item] || false);
  try {
    const rows = await _sb('/rest/v1/shopping?category=eq.'+cat+'&item=eq.'+item+'&select=id');
    if (rows.length) {
      await _sb('/rest/v1/shopping?id=eq.'+rows[0].id, {method:'PATCH', body: JSON.stringify({checked})});
    } else {
      await _sb('/rest/v1/shopping', {method:'POST', body: JSON.stringify({category:cat, item:item, checked})});
    }
  } catch(e) { console.log('shop toggle err', e); }
  if (!shoppingData[cat]) shoppingData[cat] = {};
  shoppingData[cat][item] = checked;
  renderShop();
}

// ═══ TASKS ═══
let _tasks = [];

async function loadTasks() {
  try {
    _tasks = await _sb('/rest/v1/tasks?select=*&order=created_at.desc');
  } catch(e) { console.log('tasks load err', e); }
  renderAllTasks();
}

function renderAllTasks() {
  ['duplex','work','venture','fun'].forEach(c => renderTaskList(c, c+'-list'));
}

function renderTaskList(cat, id) {
  const tasks = _tasks.filter(t => t.cat === cat);
  const el = document.getElementById(id);
  if (!el) return;
  const now = new Date();
  el.innerHTML = tasks.map(t => {
    const d = t.done;
    let dot = d ? 'done' : (t.scheduled ? 'scheduled' : 'pending');
    let ds = '';
    if (t.scheduled) {
      const sd = new Date(t.scheduled);
      if (sd < now && !d) dot = 'pending';
      ds = sd.toLocaleDateString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    }
    return '<div class="task-item"><div class="dot '+dot+'"></div><div class="task-text '+(d?'done-text':'')+'" onclick="toggleTask('+t.id+')">'+t.text+'</div><div class="task-date">'+ds+'</div><button class="del-btn" onclick="deleteTask('+t.id+')">✕</button></div>';
  }).join('');
}

async function toggleTask(id) {
  try {
    const t = _tasks.find(x => x.id === id);
    if (!t) return;
    await _sb('/rest/v1/tasks?id=eq.'+id, {method:'PATCH', body: JSON.stringify({done: !t.done})});
    t.done = !t.done;
    renderAllTasks();
  } catch(e) { console.log('toggle err', e); }
}

async function deleteTask(id) {
  try {
    await _sb('/rest/v1/tasks?id=eq.'+id, {method:'DELETE'});
    _tasks = _tasks.filter(t => t.id !== id);
    renderAllTasks();
  } catch(e) { console.log('delete err', e); }
}

async function addTask(cat, inputId, dtId) {
  const text = document.getElementById(inputId).value.trim();
  if (!text) return;
  const dtVal = document.getElementById(dtId).value;
  const scheduled = dtVal ? new Date(dtVal).toISOString() : null;
  try {
    const result = await _sb('/rest/v1/tasks?select=*', {method:'POST', body: JSON.stringify({text, cat, scheduled})});
    if (result && result[0]) _tasks.unshift(result[0]);
  } catch(e) { console.log('add err', e); }
  document.getElementById(inputId).value = '';
  document.getElementById(dtId).value = '';
  renderAllTasks();
}

function addDuplexTask() { addTask('duplex','dt-input','dt-dt'); }
function addWorkTask() { addTask('work','wk-input','wk-dt'); }
function addVentureTask() { addTask('venture','ve-input','ve-dt'); }
function addFunTask() { addTask('fun','fn-input','fn-dt'); }

function openPage(name) {
  document.getElementById('hub').classList.remove('active');
  document.getElementById('page-'+name).classList.add('active');
}
function backHome() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('hub').classList.add('active');
}
function switchShopTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('shop-list').style.display = tab==='list' ? 'block' : 'none';
  document.getElementById('duplex-tasks').style.display = tab==='tasks' ? 'block' : 'none';
}

loadShop();
loadTasks();</script>
